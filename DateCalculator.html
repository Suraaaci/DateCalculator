<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>天数计算器 · Date Calculator</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #202936;
      --muted: #748091;
      --line: #e7ebf0;
      --accent: #3867d6;
      --accent-dark: #2854bc;
      --soft: #edf3ff;
      --success: #247a58;
      --shadow: 0 18px 55px rgba(34, 48, 70, .09);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(56,103,214,.09), transparent 28rem),
        radial-gradient(circle at 90% 90%, rgba(63,157,130,.08), transparent 25rem),
        var(--bg);
    }
    .app { width: min(100%, 680px); }
    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px 4px;
    }
    .logo {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 13px;
      color: white; background: var(--accent);
      font-size: 21px; font-weight: 700;
      box-shadow: 0 7px 18px rgba(56,103,214,.22);
    }
    .brand-title { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .01em; }
    .brand-sub { margin: 3px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .13em; }
    .card {
      padding: clamp(23px, 5vw, 42px);
      border: 1px solid rgba(225,230,237,.9);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
    }
    h1 { margin-top: -2pt; font-size: clamp(25px, 6vw, 30px); letter-spacing: -.04em; }
    .intro { margin: 10px 0 29px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fcfdff;
    }
    .field label {
      display: block;
      margin-bottom: 11px;
      color: #586577;
      font-size: 12px;
      font-weight: 650;
    }
    input[type="date"] {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 17px 0 23px;
    }
    .text-button {
      padding: 8px 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .text-button:hover { color: var(--accent); }
    .button-row { display: flex; gap: 9px; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(56,103,214,.24);
      outline-offset: 3px;
    }
    .primary, .secondary {
      border: 0;
      border-radius: 11px;
      padding: 12px 17px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .primary { color: white; background: var(--accent); }
    .primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .secondary { color: #4f5d70; background: #f0f3f7; }
    .secondary:hover { background: #e7ecf3; }
    .result {
      padding: 23px 20px 20px;
      border: 1px solid #e0eaff;
      border-radius: 17px;
      text-align: center;
      background: linear-gradient(145deg, #f5f8ff, #f8fbff);
    }
    .result-label { margin: 0; color: #62728a; font-size: 12px; }
    .number-line {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 9px;
      margin: 5px 0 2px;
    }
    #resultNumber {
      color: var(--accent);
      font-size: clamp(48px, 11vw, 68px);
      font-weight: 760;
      line-height: 1.15;
      letter-spacing: -.055em;
      overflow-wrap: anywhere;
    }
    .unit { color: #4d5c70; font-size: 17px; font-weight: 650; }
    #detail { min-height: 20px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .message {
      min-height: 18px;
      margin: 12px 0 0;
      color: #b34b42;
      text-align: center;
      font-size: 12px;
    }
    .foot {
      margin: 18px 0 0;
      color: #8a95a3;
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }
    @media (max-width: 520px) {
      body { padding: 22px 13px; }
      .date-grid { grid-template-columns: 1fr; }
      .card { border-radius: 20px; }
      .actions { align-items: flex-start; flex-direction: column; }
      .button-row { width: 100%; }
      .button-row button { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="logo" aria-hidden="true">计</div>
      <div>
        <p class="brand-title">天数计算器</p>
        <p class="brand-sub">DATE CALCULATOR</p>
      </div>
    </header>

    <section class="card" aria-labelledby="pageTitle">
      <p class="eyebrow">A SIMPLE DATE TOOL</p>
      <h1 id="pageTitle">计算间隔天数</h1>

      <div class="date-grid">
        <div class="field">
          <label for="startDate">开始日期</label>
          <input id="startDate" type="date">
        </div>
        <div class="field">
          <label for="endDate">结束日期</label>
          <input id="endDate" type="date">
        </div>
      </div>

      <div class="actions">
        <button class="text-button" id="swapButton" type="button">⇄　交换两个日期</button>
        <div class="button-row">
          <button class="secondary" id="resetButton" type="button">重置</button>
          <button class="primary" id="calculateButton" type="button">计算天数</button>
        </div>
      </div>

      <section class="result" aria-live="polite">
        <p class="result-label">两个日期相差</p>
        <div class="number-line">
          <span id="resultNumber">0</span>
          <span class="unit">天</span>
        </div>
        <p id="detail">请选择两个日期</p>
      </section>
      <p class="message" id="message" role="status"></p>
    </section>
  </main>

  <script>
    const startInput = document.getElementById("startDate");
    const endInput = document.getElementById("endDate");
    const resultNumber = document.getElementById("resultNumber");
    const detail = document.getElementById("detail");
    const message = document.getElementById("message");

    // 使用本地日期生成 YYYY-MM-DD，避免 UTC 时区造成默认日期偏移。
    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // 把 YYYY-MM-DD 拆成年、月、日，再转换为 UTC 毫秒。
    // 不直接用本地时间戳相减，避免夏令时切换导致差一天。
    function dateToUtcMilliseconds(value) {
      if (!value) return null;
      const parts = value.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
      const [year, month, day] = parts;
      return Date.UTC(year, month - 1, day);
    }

    function calculate() {
      message.textContent = "";

      const start = dateToUtcMilliseconds(startInput.value);
      const end = dateToUtcMilliseconds(endInput.value);

      if (start === null || end === null) {
        message.textContent = "请先完整选择两个日期。";
        return;
      }

      const difference = Math.abs(end - start) / 86400000;
      resultNumber.textContent = difference.toLocaleString("zh-CN");
      detail.textContent = `${startInput.value}　至　${endInput.value}`;
    }

    function resetDates() {
      const today = formatLocalDate(new Date());
      startInput.value = today;
      endInput.value = today;
      calculate();
    }

    document.getElementById("calculateButton").addEventListener("click", calculate);
    document.getElementById("swapButton").addEventListener("click", () => {
      const oldStart = startInput.value;
      startInput.value = endInput.value;
      endInput.value = oldStart;
      calculate();
    });
    document.getElementById("resetButton").addEventListener("click", resetDates);

    // 选择日期时不自动计算；点击“计算天数”按钮后才更新结果。

    resetDates();
  </script>
</body>
</html>
